<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}وبلاگ من{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: Tahoma; background: #f5f5f5; }
        nav { background: #333; color: white; padding: 15px; }
        nav a { color: white; text-decoration: none; margin: 0 10px; }
        nav a:hover { text-decoration: underline; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; }
        .post { background: white; padding: 20px; margin: 15px 0; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .post h2 { margin-bottom: 10px; }
        .post h2 a { color: #333; text-decoration: none; }
        .post h2 a:hover { color: #007bff; }
        .meta { color: #888; font-size: 12px; margin: 10px 0; }
        .btn { background: #007bff; color: white; padding: 8px 16px; border: none; border-radius: 5px; cursor: pointer; text-decoration: none; display: inline-block; }
        .btn:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #a71d2a; }
        .messages { margin: 10px 0; }
        .alert { padding: 10px; border-radius: 5px; margin: 5px 0; }
        .alert-success { background: #d4edda; color: #155724; }
        .alert-error { background: #f8d7da; color: #721c24; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ddd; border-radius: 5px; font-family: inherit; }
        textarea { min-height: 200px; }
    </style>
</head>
<body>
    <nav>
        <a href="{% url 'post_list' %}">🏠 خانه</a>
        {% if user.is_authenticated %}
            <a href="{% url 'post_create' %}">➕ پست جدید</a>
            <span>سلام {{ user.username }}!</span>
            <a href="{% url 'logout' %}">خروج</a>
        {% else %}
            <a href="{% url 'login' %}">ورود</a>
            <a href="{% url 'signup' %}">ثبت‌نام</a>
        {% endif %}
    </nav>
    
    <div class="container">
        {% if messages %}
            <div class="messages">
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
        
        {% block content %}{% endblock %}
    </div>
</body>
</html>
