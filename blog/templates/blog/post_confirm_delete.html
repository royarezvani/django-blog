{% extends 'blog/base.html' %}

{% block content %}
<h1>🗑 حذف پست</h1>
<p>آیا مطمئنی می‌خوای «{{ post.title }}» رو حذف کنی؟</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">بله، حذف کن</button>
    <a href="{% url 'post_detail' post.id %}" class="btn">انصراف</a>
</form>
{% endblock %}
